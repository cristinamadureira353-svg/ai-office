name: Source and offline checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    strategy:
      matrix:
        python-version: ['3.9', '3.12']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - run: python -m pip install -r ai-model-party/requirements.txt
      - run: python tools/check.py
      # 内嵌 Bot 引擎带进来二十多个 node 模块和整个 bot 客户端目录，
      # 逐个点名检查会漏。整目录扫一遍，新增文件自动进检查范围。
      - name: Check Node syntax
        run: |
          find miniapps/ai-office/miniapp/node miniapps/ai-office/miniapp/client \
            \( -name '*.mjs' -o -name '*.js' \) -print0 |
            while IFS= read -r -d '' file; do
              node --check "$file"
            done
